name: Validar y empaquetar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:site
      - name: Empaquetar la versión verificada
        run: tar -C dist -czf mi-dulce-tesoro-web.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: mi-dulce-tesoro-web
          path: mi-dulce-tesoro-web.tar.gz
